<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps для GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Этот скрипт перехватывает запросы к несуществующим страницам и перенаправляет на index.html
    // с сохранением пути в параметре запроса
    sessionStorage.redirect = location.href;
  </script>
  <meta http-equiv="refresh" content="0;URL='/'">
</head>
<body>
  <p>Перенаправление...</p>
</body>
</html>
