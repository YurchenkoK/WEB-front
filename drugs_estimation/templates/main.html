<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Главная - Pfizer</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="header">
        <h1 class="logo">Pfizer</h1>
    </div>
    <div class="search-section">
        <form method="GET" action="{% url 'search' %}" class="search-form">
            <input type="text" name="search" placeholder="Поиск по названию" class="search-input" value="{{ search_query|default:'' }}">
            <button type="submit" class="search-button">Найти</button>
        </form>
    </div>
    <div class="container">
        <div class="drugs-grid">
            {% for drug in data.drugs %}
                <div class="drug-card">
                    {% if drug.image %}
                        <img src="{{ drug.image }}" alt="{{ drug.name }}" class="drug-image">
                    {% endif %}
                    <h3 class="drug-name">{{ drug.name }}</h3>
                    <p class="drug-concentration">Концентрация в амп.: {{ drug.concentration }}</p>
                    <a href="{% url 'vasoactive_drug_detail' drug.id %}" class="details-button">Подробнее</a>
                </div>
            {% endfor %}
        </div>
    </div>
    <div class="footer">
        {% if data.estimation_count > 0 %}
            <a href="{% url 'estimation_infusion_speed_with_id' data.estimation_request_id %}" class="cart-icon-link">
                <div class="icon-circle">
                    <span class="microscope">🔬</span>
                    <span class="cart-badge">{{ data.estimation_count }}</span>
                </div>
            </a>
        {% else %}
            <div class="cart-icon-link cart-icon-disabled" title="Добавьте препараты в заявку">
                <div class="icon-circle">
                    <span class="microscope">🔬</span>
                </div>
            </div>
        {% endif %}
    </div>
</body>
</html>
